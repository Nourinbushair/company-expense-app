<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>All Expenses - Company Expense App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container wide-container">


        <div class="page-header">

            <div>

                <h1>
                    All Expenses
                </h1>

                <p>
                    Shared company expense records
                </p>

            </div>

            <a
                href="add-expense.html"
                class="header-button"
            >
                + Add Expense
            </a>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Employee
                        </th>

                        <th>
                            Source
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            For What
                        </th>

                        <th>
                            Type
                        </th>

                        <th>
                            Date
                        </th>

                    </tr>

                </thead>


                <tbody id="expenseTable">

                </tbody>

            </table>

        </div>


        <p id="expensesMessage"></p>


        <a
            href="dashboard.html"
            class="back-link"
        >
            ← Dashboard
        </a>


    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>

</body>

</html>
