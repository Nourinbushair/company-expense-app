<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Expense</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Add Expense</h1>

        <form id="expenseForm">

            <label>Source</label>

            <input
                type="text"
                id="source"
                placeholder="Salary, Parent, Pocket Money..."
                required
            >

            <label>Expense Amount</label>

            <input
                type="number"
                id="amount"
                min="0.01"
                step="0.01"
                placeholder="500"
                required
            >

            <label>For What</label>

            <input
                type="text"
                id="forWhat"
                placeholder="Office supplies, Lunch..."
                required
            >

            <label>Company / Personal</label>

            <select id="expenseType" required>

                <option value="Company">
                    Company
                </option>

                <option value="Personal">
                    Personal
                </option>

            </select>

            <label>Date</label>

            <input
                type="date"
                id="expenseDate"
                required
            >

            <button type="submit">
                Save Expense
            </button>

        </form>

        <p id="expenseMessage"></p>

        <a href="dashboard.html">
            Back to Dashboard
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>

</body>

</html>
