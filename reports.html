<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reports - Company Expense App</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .report-header h1 {
            margin-bottom: 5px;
        }

        .report-header p {
            margin: 0;
            color: #64748b;
        }

        .report-controls {
            display: flex;
            gap: 12px;
            align-items: end;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .report-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .report-control label {
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        .report-control select {
            min-width: 170px;
        }

        .report-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .report-button {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .print-button {
            background: #2563eb;
            color: white;
        }

        .csv-button {
            background: #0f766e;
            color: white;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        }

        .summary-card h3 {
            margin: 0 0 8px;
            font-size: 14px;
            color: #64748b;
        }

        .summary-card .summary-value {
            font-size: 24px;
            font-weight: 700;
            color: #172033;
        }

        .summary-card.total {
            border-left: 4px solid #2563eb;
        }

        .summary-card.company {
            border-left: 4px solid #16a34a;
        }

        .summary-card.personal {
            border-left: 4px solid #f59e0b;
        }

        .summary-card.room {
            border-left: 4px solid #7c3aed;
        }

        .report-table-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        .report-table-card h2 {
            margin-top: 0;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        .report-table th,
        .report-table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        .report-table th {
            background: #f8fafc;
            color: #334155;
            font-size: 14px;
        }

        .report-table td {
            color: #475569;
        }

        .report-empty {
            text-align: center;
            padding: 35px;
            color: #64748b;
        }

        .report-status {
            margin: 15px 0;
            color: #475569;
        }

        @media (max-width: 900px) {
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }

            .report-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .report-control select {
                width: 100%;
            }

            .report-buttons {
                width: 100%;
            }

            .report-button {
                flex: 1;
            }
        }

        @media print {

            body {
                background: white !important;
            }

            .report-controls,
            .back-link,
            .no-print {
                display: none !important;
            }

            .container {
                max-width: 100%;
                width: 100%;
                margin: 0;
                padding: 0;
            }

            .summary-card,
            .report-table-card {
                box-shadow: none;
                border: 1px solid #ddd;
            }

            .report-header {
                margin-bottom: 15px;
            }

            .report-table {
                min-width: 0;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <div class="report-header">

        <div>
            <h1>Expense Reports</h1>

            <p id="reportPeriod">
                Monthly expense report
            </p>
        </div>

    </div>


    <!-- FILTERS -->

    <div class="report-controls no-print">

        <div class="report-control">

            <label for="reportMonth">
                Month
            </label>

            <select id="reportMonth">

                <option value="0">January</option>
                <option value="1">February</option>
                <option value="2">March</option>
                <option value="3">April</option>
                <option value="4">May</option>
                <option value="5">June</option>
                <option value="6">July</option>
                <option value="7">August</option>
                <option value="8">September</option>
                <option value="9">October</option>
                <option value="10">November</option>
                <option value="11">December</option>

            </select>

        </div>


        <div class="report-control">

            <label for="reportYear">
                Year
            </label>

            <select id="reportYear"></select>

        </div>


        <div class="report-buttons">

            <button
                type="button"
                class="report-button print-button"
                onclick="printReport()"
            >
                🖨️ Print / PDF
            </button>

            <button
                type="button"
                class="report-button csv-button"
                onclick="exportCSV()"
            >
                📥 Export CSV
            </button>

        </div>

    </div>


    <p
        id="reportStatus"
        class="report-status"
    >
        Loading report...
    </p>


    <!-- SUMMARY -->

    <div class="summary-grid">

        <div class="summary-card total">

            <h3>
                Total Expense
            </h3>

            <div
                class="summary-value"
                id="totalExpense"
            >
                SAR 0.00
            </div>

        </div>


        <div class="summary-card company">

            <h3>
                Company Expense
            </h3>

            <div
                class="summary-value"
                id="companyExpense"
            >
                SAR 0.00
            </div>

        </div>


        <div class="summary-card personal">

            <h3>
                Personal Expense
            </h3>

            <div
                class="summary-value"
                id="personalExpense"
            >
                SAR 0.00
            </div>

        </div>


        <div class="summary-card room">

            <h3>
                Room Expense
            </h3>

            <div
                class="summary-value"
                id="roomExpense"
            >
                SAR 0.00
            </div>

        </div>

    </div>


    <!-- TRANSACTION COUNT -->

    <div class="dashboard-card">

        <h3>
            Transactions
        </h3>

        <p
            id="transactionCount"
        >
            0 transactions
        </p>

    </div>


    <!-- REPORT TABLE -->

    <div class="report-table-card">

        <h2>
            Monthly Transactions
        </h2>

        <table class="report-table">

            <thead>

                <tr>

                    <th>
                        Date
                    </th>

                    <th>
                        Employee
                    </th>

                    <th>
                        Source
                    </th>

                    <th>
                        For What
                    </th>

                    <th>
                        Type
                    </th>

                    <th>
                        Amount
                    </th>

                </tr>

            </thead>

            <tbody id="reportTableBody">

                <tr>

                    <td
                        colspan="6"
                        class="report-empty"
                    >
                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <br>


    <a
        href="dashboard.html"
        class="back-link"
    >
        ← Back to Dashboard
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>


<script>

let currentReportExpenses = [];


/* --------------------------------
   FORMAT MONEY
-------------------------------- */

function formatReportAmount(amount) {

    return "SAR " + Number(amount || 0).toFixed(2);

}


/* --------------------------------
   SET YEAR OPTIONS
-------------------------------- */

function setupReportYears() {

    const yearSelect =
        document.getElementById("reportYear");

    const currentYear =
        new Date().getFullYear();

    for (
        let year = currentYear - 5;
        year <= currentYear + 1;
        year++
    ) {

        const option =
            document.createElement("option");

        option.value = year;

        option.textContent = year;

        yearSelect.appendChild(option);

    }

}


/* --------------------------------
   SET CURRENT MONTH
-------------------------------- */

function setupCurrentMonth() {

    const now = new Date();

    document.getElementById("reportMonth").value =
        now.getMonth();

    document.getElementById("reportYear").value =
        now.getFullYear();

}


/* --------------------------------
   LOAD REPORT
-------------------------------- */

async function loadReport() {

    const month =
        Number(
            document.getElementById("reportMonth").value
        );

    const year =
        Number(
            document.getElementById("reportYear").value
        );


    const status =
        document.getElementById("reportStatus");

    status.textContent =
        "Loading report...";


    const startDate =
        `${year}-${String(month + 1).padStart(2, "0")}-01`;


    const nextMonth =
        new Date(year, month + 1, 1);


    const nextYear =
        nextMonth.getFullYear();

    const nextMonthNumber =
        String(nextMonth.getMonth() + 1).padStart(2, "0");


    const endDate =
        `${nextYear}-${nextMonthNumber}-01`;


    const {
        data,
        error
    } = await supabaseClient

        .from("expenses")

        .select(`
            id,
            user_id,
            source,
            amount,
            for_what,
            expense_type,
            expense_date,
            created_at
        `)

        .gte(
            "expense_date",
            startDate
        )

        .lt(
            "expense_date",
            endDate
        )

        .order(
            "expense_date",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Report error:",
            error
        );

        status.textContent =
            "Unable to load report.";

        return;

    }


    currentReportExpenses =
        data || [];


    calculateSummary(
        currentReportExpenses
    );


    await renderReportTable(
        currentReportExpenses
    );


    const monthName =
        new Date(
            year,
            month,
            1
        ).toLocaleString(
            "en-US",
            {
                month: "long"
            }
        );


    document.getElementById(
        "reportPeriod"
    ).textContent =
        `${monthName} ${year} Expense Report`;


    status.textContent =
        `Report loaded: ${currentReportExpenses.length} transaction(s).`;

}


/* --------------------------------
   CALCULATE SUMMARY
-------------------------------- */

function calculateSummary(expenses) {

    let total = 0;

    let company = 0;

    let personal = 0;

    let room = 0;


    expenses.forEach(expense => {

        const amount =
            Number(expense.amount) || 0;

        total += amount;


        if (
            expense.expense_type === "Company"
        ) {

            company += amount;

        }


        if (
            expense.expense_type === "Personal"
        ) {

            personal += amount;

        }


        if (
            expense.expense_type === "Room Expense"
        ) {

            room += amount;

        }

    });


    document.getElementById(
        "totalExpense"
    ).textContent =
        formatReportAmount(total);


    document.getElementById(
        "companyExpense"
    ).textContent =
        formatReportAmount(company);


    document.getElementById(
        "personalExpense"
    ).textContent =
        formatReportAmount(personal);


    document.getElementById(
        "roomExpense"
    ).textContent =
        formatReportAmount(room);


    document.getElementById(
        "transactionCount"
    ).textContent =
        `${expenses.length} transaction(s)`;

}


/* --------------------------------
   LOAD EMPLOYEE PROFILES
-------------------------------- */

async function renderReportTable(expenses) {

    const tbody =
        document.getElementById(
            "reportTableBody"
        );


    if (!expenses.length) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="report-empty"
                >
                    No expenses found for this month.

                </td>

            </tr>

        `;

        return;

    }


    const userIds = [
        ...new Set(
            expenses.map(
                expense => expense.user_id
            )
        )
    ];


    const {
        data: profiles,
        error
    } = await supabaseClient

        .from("profiles")

        .select(
            "id, employee_id, name"
        )

        .in(
            "id",
            userIds
        );


    if (error) {

        console.error(
            "Profile error:",
            error
        );

    }


    const profileMap = {};


    (profiles || []).forEach(profile => {

        profileMap[profile.id] =
            profile;

    });


    tbody.innerHTML = expenses.map(
        expense => {

            const profile =
                profileMap[expense.user_id];


            const employee =
                profile
                    ? `${profile.employee_id} - ${profile.name}`
                    : "Unknown";


            return `

                <tr>

                    <td>
                        ${escapeReportHTML(
                            expense.expense_date
                        )}
                    </td>

                    <td>
                        ${escapeReportHTML(
                            employee
                        )}
                    </td>

                    <td>
                        ${escapeReportHTML(
                            expense.source
                        )}
                    </td>

                    <td>
                        ${escapeReportHTML(
                            expense.for_what
                        )}
                    </td>

                    <td>
                        ${escapeReportHTML(
                            expense.expense_type
                        )}
                    </td>

                    <td>
                        ${formatReportAmount(
                            expense.amount
                        )}
                    </td>

                </tr>

            `;

        }
    ).join("");

}


/* --------------------------------
   ESCAPE HTML
-------------------------------- */

function escapeReportHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* --------------------------------
   PRINT
-------------------------------- */

function printReport() {

    window.print();

}


/* --------------------------------
   CSV EXPORT
-------------------------------- */

function exportCSV() {

    if (
        !currentReportExpenses.length
    ) {

        alert(
            "There are no expenses to export."
        );

        return;

    }


    const rows = [

        [
            "Date",
            "Employee ID",
            "Employee Name",
            "Source",
            "For What",
            "Expense Type",
            "Amount"
        ]

    ];


    currentReportExpenses.forEach(
        expense => {

            rows.push([

                expense.expense_date,

                expense.user_id,

                expense.source,

                expense.for_what,

                expense.expense_type,

                expense.amount

            ]);

        }
    );


    const csv =
        rows.map(row =>
            row.map(value => {

                const text =
                    String(
                        value ?? ""
                    );

                return `"${text.replace(
                    /"/g,
                    '""'
                )}"`;

            }).join(",")

        ).join("\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    const month =
        document.getElementById(
            "reportMonth"
        ).value;


    const year =
        document.getElementById(
            "reportYear"
        ).value;


    link.download =
        `expense-report-${year}-${String(
            Number(month) + 1
        ).padStart(2, "0")}.csv`;


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}


/* --------------------------------
   INITIALIZE
-------------------------------- */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        setupReportYears();

        setupCurrentMonth();


        document.getElementById(
            "reportMonth"
        ).addEventListener(
            "change",
            loadReport
        );


        document.getElementById(
            "reportYear"
        ).addEventListener(
            "change",
            loadReport
        );


        const {
            data: {
                session
            }
        } = await supabaseClient.auth.getSession();


        if (!session) {

            window.location.href =
                "index.html";

            return;

        }


        await loadReport();

    }
);

</script>

</body>

</html>
