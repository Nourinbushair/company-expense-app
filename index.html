<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Company Expense App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Company Expense App</h1>

        <h2>Login</h2>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

        <p>
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>

</body>

</html>
