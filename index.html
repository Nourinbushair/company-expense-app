<form id="loginForm">

    <label for="loginEmail">
        Email
    </label>

    <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
        required
    >

    <label for="loginPassword">
        Password
    </label>

    <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
        required
    >

    <button
        type="submit"
        class="primary-button"
    >
        Login
    </button>

</form>

<p id="loginMessage"></p>
