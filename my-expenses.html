<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Expenses - Company Expense App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container wide-container">

        <div class="page-header">

            <div>
                <h1>My Expenses</h1>
                <p>View and manage your expenses</p>
            </div>

            <a
                href="add-expense.html"
                class="header-button"
            >
                + Add Expense
            </a>

        </div>


        <!-- EDIT FORM -->

        <div
            id="editExpenseSection"
            style="display:none;"
        >

            <h2>Edit Expense</h2>

            <form id="editExpenseForm">

                <input
                    type="hidden"
                    id="editExpenseId"
                >

                <label for="editSource">
                    Source
                </label>

                <input
                    type="text"
                    id="editSource"
                    required
                >


                <label for="editAmount">
                    Amount
                </label>

                <input
                    type="number"
                    id="editAmount"
                    min="0.01"
                    step="0.01"
                    required
                >


                <label for="editForWhat">
                    For What
                </label>

                <input
                    type="text"
                    id="editForWhat"
                    required
                >


                <label for="editExpenseType">
                    Expense Type
                </label>

                <select
                    id="editExpenseType"
                    required
                >

                    <option value="Company">
                        Company
                    </option>

                    <option value="Personal">
                        Personal
                    </option>

                    <option value="Room Expense">
                        Room Expense
                    </option>

                </select>


                <label for="editExpenseDate">
                    Date
                </label>

                <input
                    type="date"
                    id="editExpenseDate"
                    required
                >


                <button
                    type="submit"
                    class="primary-button"
                >
                    Update Expense
                </button>


                <button
                    type="button"
                    id="cancelEditButton"
                >
                    Cancel
                </button>

            </form>

            <p id="editExpenseMessage"></p>

        </div>


        <!-- EXPENSE TABLE -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>Source</th>
                        <th>Amount</th>
                        <th>For What</th>
                        <th>Type</th>
                        <th>Date</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="myExpenseTable">

                </tbody>

            </table>

        </div>


        <p id="myExpensesMessage"></p>


        <a
            href="dashboard.html"
            class="back-link"
        >
            ← Back to Dashboard
        </a>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>

</body>

</html>
