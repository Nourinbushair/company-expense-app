<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Expenses - Company Expense App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container wide-container">

        <!-- HEADER -->

        <div class="page-header">

            <div>

                <h1>
                    My Expenses
                </h1>

                <p>
                    View and manage your expenses
                </p>

            </div>

            <a
                href="add-expense.html"
                class="header-button"
            >
                + Add Expense
            </a>

        </div>


        <!-- EXPENSE TABLE -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Source
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            For What
                        </th>

                        <th>
                            Type
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>

                <tbody id="myExpenseTable">

                </tbody>

            </table>

        </div>


        <p id="myExpensesMessage"></p>


        <!-- BACK -->

        <a
            href="dashboard.html"
            class="back-link"
        >
            ← Back to Dashboard
        </a>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>

</body>

</html>
