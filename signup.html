<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Company Expense App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-container">

        <div class="brand-icon">
            +
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Company Expense Management
        </p>


        <form id="signupForm">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                required
            >


            <label for="department">
                Department
            </label>

            <input
                type="text"
                id="department"
                placeholder="Technical, HR, Finance..."
            >


            <button
                type="submit"
                class="primary-button"
            >
                Create Account
            </button>

        </form>


        <p id="message"></p>


        <div class="auth-footer">

            <p>

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>

</body>

</html>
